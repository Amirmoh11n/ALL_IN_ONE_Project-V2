name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5          # Node 24 compatible

      - name: Set up Python
        uses: actions/setup-python@v6      # Node 24 compatible
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        # Shows all problems. Does NOT fail the job yet so tests can still run.
        # Change to a normal `ruff check ...` once you fix the issues.
        run: ruff check src tests webapplication --output-format=full || true

      - name: Run tests
        run: pytest -q --tb=short

  docker-build:
    name: Build serving image
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: neuramri-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max