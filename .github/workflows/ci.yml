name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # allows manual runs from the Actions tab

jobs:
  lint-and-test:
    name: Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          # Install the project in editable mode + dev extras (pytest, ruff, httpx)
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests webapplication

      - name: Run tests
        run: |
          # PYTHONPATH is already set via pyproject.toml [tool.pytest.ini_options]
          pytest -q --tb=short

  docker-build:
    name: Build serving image
    runs-on: ubuntu-latest
    needs: lint-and-test          # only builds if tests pass
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: neuramri-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max