# Single source of truth for the complete training/evaluation/export pipeline.
# V2 defaults: EfficientNet-B4, monitor = val_f1_macro, image_size = 380.

data:
  raw_dir: "data/raw"
  train_dir_name: "Training"
  test_dir_name: "Testing"
  kaggle:
    dataset_slug: "masoudnickparvar/brain-tumor-mri-dataset"
  class_names: ["glioma", "meningioma", "notumor", "pituitary"]
  val_split: 0.15
  # auto: patient-aware when reliable IDs exist, otherwise stratified_image_level
  split_strategy: "auto"
  seed: 42
  image_size: 380
  quality:
    drop_corrupt: true
    drop_duplicates: true
    min_width: 32
    min_height: 32
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    random_horizontal_flip_p: 0.5
    random_rotation_degrees: 15
    color_jitter:
      brightness: 0.1
      contrast: 0.1
    mixup_alpha: 0.0
    cutmix_alpha: 0.0
  dataloader:
    batch_size: 16
    num_workers: 4
    shuffle_train: true
    pin_memory: true
    persistent_workers: true

model:
  architecture: "efficientnet_b4"
  pretrained: true
  num_classes: 4
  freeze_backbone: false

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adam"
  use_class_weights: true
  label_smoothing: 0.0
  device: "auto"
  amp: true
  gradient_clip_norm: null
  seeds: [42, 43, 44]
  early_stopping:
    patience: 5
    min_delta: 0.0
    monitor: "val_f1_macro"
  lr_scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 2

evaluation:
  num_classes: 4
  temperature_scaling: true
  ece_bins: 15
  output_dir: "artifacts/evaluation"

export:
  output_dir: "artifacts/exports"
  base_name: "brain_tumor_efficientnet_b4"
  input_size: 380
  model_version: "2.0.0"
  formats:
    torchscript: true
    onnx: true
    int8: false
  onnx:
    opset_version: 18
    dynamo: false
    atol: 0.001
    rtol: 0.001

artifacts:
  checkpoint_dir: "artifacts/checkpoints"
  checkpoint: "artifacts/checkpoints/best_model.pt"
  evaluation_file: "artifacts/evaluation/test_metrics.json"
  config_snapshot_dir: "artifacts/runs"

explainability:
  enabled: true
  method: "gradcam++"
  samples_per_class: 3
  output_dir: "artifacts/explainability"

tracking:
  mlflow:
    enabled: true
    tracking_uri: "sqlite:///artifacts/mlruns/mlflow.db"
    artifact_location: "artifacts/mlruns"
    experiment_name: "brain_tumor_classification"

logging:
  level: "INFO"

web:
  i18n_default: "en"
  disclaimer: true
