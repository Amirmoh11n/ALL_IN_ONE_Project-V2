# Single source of truth for the complete training/evaluation/export pipeline.

data:
  raw_dir: "data/raw"
  train_dir_name: "Training"
  test_dir_name: "Testing"
  kaggle:
    dataset_slug: "masoudnickparvar/brain-tumor-mri-dataset"
  class_names: ["glioma", "meningioma", "notumor", "pituitary"]
  val_split: 0.15
  split_strategy: "stratified_image_level"
  seed: 42
  image_size: 300
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  augmentation:
    random_horizontal_flip_p: 0.5
    random_rotation_degrees: 15
    color_jitter:
      brightness: 0.1
      contrast: 0.1
  dataloader:
    batch_size: 32
    num_workers: 4
    shuffle_train: true
    pin_memory: true
    persistent_workers: true

model:
  architecture: "efficientnet_b3"
  pretrained: true
  num_classes: 4
  freeze_backbone: false

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.00001
  optimizer: "adam"
  use_class_weights: true
  device: "auto"       # auto | cuda | cpu
  amp: true            # CUDA mixed precision; automatically disabled on CPU
  early_stopping:
    patience: 5
    min_delta: 0.0
    monitor: "val_loss"
  lr_scheduler:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 2

evaluation:
  num_classes: 4

export:
  output_dir: "artifacts/exports"
  base_name: "brain_tumor_efficientnet_b3"
  input_size: 300
  onnx:
    opset_version: 18

artifacts:
  checkpoint_dir: "artifacts/checkpoints"
  checkpoint: "artifacts/checkpoints/best_model.pt"
  evaluation_file: "artifacts/evaluation/test_metrics.json"

tracking:
  mlflow:
    enabled: true
    tracking_uri: "sqlite:///artifacts/mlruns/mlflow.db"
    artifact_location: "artifacts/mlruns"
    experiment_name: "brain_tumor_classification"

logging:
  level: "INFO"
